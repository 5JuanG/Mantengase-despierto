<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preguntas para el auditorio</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--txt:#1d2433;--acc:#2f5bea;--bor:#d9deea}
  @media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--txt:#e8ebf3;--acc:#6b8cff;--bor:#343b52}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:16px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:1.4rem;text-align:center;margin:8px 0 20px}
  .card{background:var(--card);border:1px solid var(--bor);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{font-size:1.05rem;margin:0 0 12px}
  label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--bor);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:1rem}
  label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
  input[type=radio]{margin-top:3px;accent-color:var(--acc);transform:scale(1.2)}
  button{width:100%;padding:14px;font-size:1.05rem;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{text-align:center;font-size:.95rem;margin-top:10px;color:#d33}
  #gracias{display:none;text-align:center;padding:40px 10px;font-size:1.3rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Responde estas 3 preguntas</h1>
  <form id="f">
    <div class="card">
      <h2>1. ¿Ya cayó el imperio mundial de la religión falsa?</h2>
      <label><input type="radio" name="p1" value="a"> a) Sí</label>
      <label><input type="radio" name="p1" value="b"> b) No</label>
    </div>
    <div class="card">
      <h2>2. ¿Qué es primero: «el grito de paz y seguridad» o la destrucción de Babilonia la Grande?</h2>
      <label><input type="radio" name="p2" value="a"> a) Primero es el grito de paz y seguridad</label>
      <label><input type="radio" name="p2" value="b"> b) Primero es la destrucción de Babilonia la Grande</label>
      <label><input type="radio" name="p2" value="c"> c) No sabemos con exactitud</label>
    </div>
    <div class="card">
      <h2>3. ¿Está juzgando Jesucristo ahora a las personas como ovejas y cabras?</h2>
      <label><input type="radio" name="p3" value="a"> a) Sí</label>
      <label><input type="radio" name="p3" value="b"> b) No</label>
    </div>
    <button type="submit" id="btn">Enviar respuestas</button>
    <div class="msg" id="msg"></div>
  </form>
  <div id="gracias" class="card">✅ ¡Gracias! Tus respuestas fueron registradas.</div>
</div>
<script>
// Pega aquí la URL de tu aplicación web de Google Apps Script
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxR6xkQ2sFXvmfXMJtSzOEJP36o2AnKUsjD8SPDWV5BTcMHoSSHUnIXI0nIyIo-Q39kPg/exec";

const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const d = new FormData(f);
  if (!d.get('p1') || !d.get('p2') || !d.get('p3')) { msg.textContent = 'Por favor contesta las 3 preguntas.'; return; }
  btn.disabled = true; msg.textContent = 'Enviando...';
  try {
    await fetch(URL_SCRIPT, {
      method: 'POST', mode: 'no-cors',
      body: new URLSearchParams({p1: d.get('p1'), p2: d.get('p2'), p3: d.get('p3')})
    });
    f.style.display = 'none';
    document.getElementById('gracias').style.display = 'block';
  } catch (err) {
    msg.textContent = 'No se pudo enviar. Intenta de nuevo.'; btn.disabled = false;
  }
});
</script>
</body>
</html>
